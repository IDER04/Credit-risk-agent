requires-python = ">=3.13"
dependencies = [
    "mysql-connector-python>=26.7.0",
    "openai>=1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
